name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: geopuls
          POSTGRES_PASSWORD: geopuls
          POSTGRES_DB: geopuls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geopuls -d geopuls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GEOPULS_CI_DB: "1"
      # Тесты работают с отдельной базой: они чистят таблицы, рабочую БД трогать нельзя
      GEOPULS_DATABASE_URL: postgresql+asyncpg://geopuls:geopuls@localhost:5432/geopuls_test
    steps:
      - uses: actions/checkout@v4
      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Создать тестовую БД
        run: PGPASSWORD=geopuls psql -h localhost -U geopuls -d geopuls -c "CREATE DATABASE geopuls_test"
      - name: Установить зависимости
        run: uv sync --locked
      - name: Применить миграции
        run: uv run alembic upgrade head
      - name: Проверить, что модели совпадают с миграциями
        run: uv run alembic check
      - name: Линтер
        run: uv run ruff check .
      - name: Форматирование
        run: uv run ruff format --check .
      - name: Тесты
        run: uv run pytest

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости
        run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Тесты
        run: npm run test
      - name: Сборка
        run: npm run build
      - name: Проверить, что воркер MapLibre попал в public/
        run: |
          for file in maplibre-gl-worker.mjs maplibre-gl-shared.mjs maplibre-gl-worker-dev.mjs maplibre-gl-shared-dev.mjs; do
            test -s "public/$file" || { echo "не найден public/$file"; exit 1; }
          done

  compose:
    name: compose (валидация конфигурации)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config > /dev/null

  # Сборка образов проверяется отдельной задачей: Dockerfile — часть продукта,
  # и его поломка не должна обнаруживаться только при деплое.
  images:
    name: docker (сборка образов)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Собрать образы API и фронтенда
        run: docker compose build api web
