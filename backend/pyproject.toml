[project]
name = "geopuls-api"
version = "0.1.0"
description = "ГЕОПУЛЬС — API тепловых карт плотности организаций по открытым данным (OSM)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.20",
    "geoalchemy2>=0.20",
    "h3>=4.5,<5",
    # Чтение OSM PBF (импортёр данных и разведка покрытия — см. docs/tz.md, разделы 2 и 11)
    "osmium>=4.3.1",
    # HTTP-клиент: загрузка границы города из Nominatim и выгрузки OSM (продакшн-код импортёров)
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geopuls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]
# RUF001/RUF002/RUF003 ловят кириллические буквы, похожие на латинские.
# Документация, строки интерфейса и сообщения об ошибках в проекте — на русском языке,
# поэтому эти правила отключены осознанно.
ignore = ["RUF001", "RUF002", "RUF003"]
